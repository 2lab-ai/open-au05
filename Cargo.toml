[package]
name = "open-au05"
version = "0.1.0"
edition = "2021"
description = "Complete open-source Linux driver, daemon, voice dictation engine, LED controller, and TUI for the Ulanzi Vibe Key AU05 (fff1:00dd)"
license = "MIT"
repository = "https://github.com/2lab-ai/open-au05"
keywords = ["ulanzi", "au05", "vibekey", "hid", "linux", "dictation"]
categories = ["command-line-utilities", "hardware-support"]

[lib]
name = "open_au05"
path = "src/lib.rs"

[[bin]]
name = "open-au05"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
ctrlc = { version = "3.4", features = ["termination"] }
libc = "0.2"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
